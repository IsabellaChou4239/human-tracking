[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgbd-operator-pipeline"
version = "0.1.0"
description = "Modular ROS bag RGB-D operator localisation pipeline"
requires-python = ">=3.10"
dependencies = ["ultralytics", "opencv-python", "numpy"]

[project.scripts]
rgbd-operator = "rgbd_operator_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
